<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5c1226">
<title>Prova Cega de Vinhos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --claret: #7b1830;
    --claret-deep: #5c1226;
    --blush: #f7eef0;
    --blush-strong: #efdde1;
    --bottle: #1f4d3a;
    --bottle-soft: #e3efe8;
    --ink: #1e1418;
    --muted: #5f4f54;
    --line: #e2d3d7;
    --paper: #ffffff;
    --alert: #a3202b;
    --alert-soft: #fbe6e7;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { font-size: 19px; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--blush); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 16px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: .5em 0 .35em; color: var(--claret-deep); }
  h2 { font-size: 1.25rem; line-height: 1.25; margin: 0 0 .5em; }
  h3 { font-size: 1.1rem; margin: 1.4em 0 .2em; }
  p { margin: .4em 0; }
  .center { text-align: center; }
  .lead { font-size: 1.1rem; color: var(--muted); }
  .small { font-size: .9rem; color: var(--muted); }

  .card { background: var(--paper); border-radius: 20px; padding: 18px; margin: 14px 0; border: 1px solid var(--line); }
  .card.host { border: 3px solid var(--bottle); }
  .host-tag { display: inline-block; background: var(--bottle); color: #fff; font-weight: 700; font-size: .85rem; padding: 3px 12px; border-radius: 99px; margin-bottom: 10px; }

  label { display: block; font-weight: 700; margin: 16px 0 6px; }
  input, select {
    width: 100%; font: inherit; font-size: 1.15rem; padding: 14px; color: var(--ink);
    border: 2px solid #cdb9be; border-radius: 12px; background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: var(--claret); box-shadow: 0 0 0 4px var(--blush-strong); }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--claret); outline-offset: 3px; }

  .btn { display: block; width: 100%; min-height: 62px; margin-top: 16px; padding: 14px 18px; border-radius: 14px; border: 2px solid transparent; font-size: 1.15rem; font-weight: 700; }
  .btn.primary { background: var(--claret); color: #fff; }
  .btn.primary:active { background: var(--claret-deep); }
  .btn.green { background: var(--bottle); color: #fff; }
  .btn.outline { background: #fff; color: var(--claret); border-color: var(--claret); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 12px; }
  .row > .btn { flex: 1; }
  .row > .btn.narrow { flex: 0 0 34%; }
  .textbtn { display: block; margin: 14px auto 0; background: none; border: none; color: var(--claret); text-decoration: underline; font-size: 1rem; padding: 10px; min-height: 44px; }
  .smallbtn { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: .9rem; min-height: 44px; flex: none; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: .95rem; }
  .top b { color: var(--claret); letter-spacing: .08em; }

  .brand { text-align: center; padding: 28px 0 4px; }
  .brand .glass { font-size: 3.6rem; line-height: 1; }
  .brand h1 { font-size: 2.2rem; margin: .3em 0 .1em; }

  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; }
  .list-row .who { min-width: 0; }
  .list-row .sub { display: block; color: var(--muted); font-size: .95rem; }
  .empty { color: var(--muted); font-style: italic; }

  .waiting { text-align: center; padding: 20px; border-radius: 16px; background: var(--blush-strong); color: var(--claret-deep); font-weight: 700; font-size: 1.1rem; }

  #qr { display: flex; justify-content: center; padding: 14px; background: #fff; border-radius: 12px; }
  #qr img, #qr canvas { max-width: 100%; height: auto; }
  .bigcode { display: block; text-align: center; font-size: 2.4rem; font-weight: 700; letter-spacing: .25em; color: var(--claret); margin: 4px 0; }
  .url { word-break: break-all; }
  .num-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; font-size: 1.05rem; }
  .num-line input { width: 92px; text-align: center; font-weight: 700; }

  /* The bottle label: the one bold element */
  .label-wrap { display: flex; justify-content: center; margin: 18px 0 10px; }
  .bottle-label {
    width: min(280px, 80vw); padding: 16px 12px 14px; text-align: center; background: #fff;
    border: 3px solid var(--claret); border-radius: 50% / 38%;
    box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 8px var(--claret);
  }
  .bottle-label .cap { font-size: 1rem; color: var(--muted); }
  .bottle-label .num { font-size: 4.2rem; font-weight: 700; line-height: 1; color: var(--claret-deep); }
  .bottle-label .of { font-size: 1rem; color: var(--muted); }

  .prompt { text-align: center; font-size: 1.2rem; font-weight: 700; margin: 8px 0; }
  .saved { text-align: center; padding: 12px; border-radius: 12px; background: var(--bottle-soft); color: var(--bottle); font-weight: 700; margin: 8px 0; }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .score {
    min-height: 82px; border-radius: 16px; border: 2px solid #cdb9be; background: #fff; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px;
  }
  .score .n { font-size: 2.1rem; font-weight: 700; line-height: 1; }
  .score .left { font-size: .82rem; color: var(--muted); margin-top: 5px; }
  .score.sel { background: var(--claret); border-color: var(--claret); color: #fff; }
  .score.sel .left { color: #fff; }
  .score:disabled { background: #efe9ea; color: #ad9fa3; border-style: dashed; cursor: default; }
  .score:disabled .left { color: #ad9fa3; }

  .changing { background: #fff6e0; border: 2px solid #c99a2e; border-radius: 16px; padding: 14px; text-align: center; margin-top: 12px; }
  .changing .btn { margin-top: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-width: 66px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; display: flex; flex-direction: column; align-items: center; font-size: .85rem; color: var(--muted); }
  .chip b { font-size: 1.3rem; color: var(--ink); }
  .chip.missing { border-color: var(--alert); background: var(--alert-soft); }
  .chip.missing b { color: var(--alert); }
  .chip.active { border-color: var(--claret); box-shadow: 0 0 0 2px var(--claret); }

  .tag-list .lbl { display: flex; align-items: center; gap: 14px; padding: 8px 0; font-size: 1.1rem; }
  .tag-num { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--claret); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.5rem; color: var(--claret-deep); background: #fff; }
  .spoiler { background: var(--alert-soft); color: var(--alert); font-weight: 700; padding: 10px 12px; border-radius: 10px; }

  .winner { text-align: center; background: var(--claret-deep); color: #fff; border-radius: 24px; padding: 26px 18px; margin: 14px 0; }
  .winner .medal { font-size: 3.4rem; line-height: 1; }
  .winner .wname { font-size: 1.9rem; font-weight: 700; line-height: 1.15; margin: 10px 0 4px; }
  .winner .avg { font-size: 3rem; font-weight: 700; margin-top: 12px; line-height: 1; }
  .winner .soft { opacity: .85; font-size: .95rem; }
  .reveal { animation: pop .7s ease-out both; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

  .rank { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rank:last-child { border-bottom: none; }
  .rk { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--blush-strong); color: var(--claret-deep); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.15rem; }
  .rk.medal { background: none; font-size: 2rem; }
  .rank .info { flex: 1; min-width: 0; }
  .rank .sub { display: block; color: var(--muted); font-size: .92rem; }
  .rank .av { font-size: 1.45rem; font-weight: 700; color: var(--claret-deep); }

  #toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%);
    width: min(520px, calc(100% - 28px)); padding: 16px 18px; border-radius: 14px; font-weight: 700; font-size: 1.05rem;
    background: var(--alert); color: #fff; box-shadow: 0 8px 28px rgba(40, 10, 20, .3); transition: transform .25s ease; z-index: 10; text-align: center;
  }
  #toast.ok { background: var(--bottle); }
  #toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app"><p class="center lead" style="margin-top:40vh">A carregar…</p></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   STEP 1 OF SETUP: paste your own Firebase settings here
   (see README.md for where to find them)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB6nrk86BwFaabgN4bET2LJ2pSsdqzcG9U",
  authDomain: "prova-vinhos.firebaseapp.com",
  projectId: "prova-vinhos",
  storageBucket: "prova-vinhos.firebasestorage.app",
  messagingSenderId: "812350894582",
  appId: "1:812350894582:web:64ad0c5295e6b1615257d7"
};
/* ===================================================================== */

const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let fs = null;

const S = {
  view: 'home', joinCode: null,
  code: null, guestId: null, hostPin: null, isHost: false, labelDone: false,
  event: null, guests: [], wines: [], ratings: {}, guestsLoaded: false,
  editing: null, showLabels: false, lastCurrent: null, pending: false, unsub: []
};

/* ---------- small helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const clampInt = (v, lo, hi, dflt) => { const n = parseInt(v, 10); return isNaN(n) ? dflt : Math.min(hi, Math.max(lo, n)); };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const fmt = v => v == null ? '–' : v.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const SKEY = 'blindWineTasting.v1';
function loadSession() { try { return JSON.parse(localStorage.getItem(SKEY)) || null; } catch (e) { return null; } }
function saveSession() { try { localStorage.setItem(SKEY, JSON.stringify({ code: S.code, guestId: S.guestId, hostPin: S.hostPin, labelDone: S.labelDone })); } catch (e) {} }
function clearSession() { try { localStorage.removeItem(SKEY); } catch (e) {} }
function setUrl(code) { try { history.replaceState(null, '', code ? '?e=' + code : location.pathname); } catch (e) {} }
const evRef = () => fs.collection('events').doc(S.code);
const guestName = id => { const g = S.guests.find(x => x.id === id); return g ? g.name : 'alguém que saiu'; };
const myScores = () => S.ratings[S.guestId] || {};

let toastTimer = null;
function toast(text, kind) {
  $toast.textContent = text;
  $toast.className = 'show' + (kind === 'ok' ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $toast.className = kind === 'ok' ? 'ok' : ''; }, 4000);
}

function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I or O, easy to read
  let c = ''; for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- live data ---------- */
function stopEvent() {
  S.unsub.forEach(u => { try { u(); } catch (e) {} });
  Object.assign(S, { unsub: [], code: null, guestId: null, hostPin: null, isHost: false, event: null, guests: [], wines: [], ratings: {}, guestsLoaded: false, editing: null, showLabels: false, lastCurrent: null });
  clearSession();
}

function subscribe() {
  const ev = evRef();
  const onErr = err => { console.error(err); toast('Problema de ligação. Verifique a internet e recarregue a página.'); };
  S.unsub.push(ev.onSnapshot(snap => {
    if (!snap.exists) { stopEvent(); setUrl(null); S.view = 'home'; toast('Esta prova já não existe.'); render(true); return; }
    S.event = snap.data();
    S.isHost = !!(S.hostPin && S.event.hostPin === S.hostPin);
    if (S.lastCurrent !== S.event.current) { S.editing = null; S.lastCurrent = S.event.current; }
    render();
  }, onErr));
  S.unsub.push(ev.collection('guests').onSnapshot(q => {
    S.guests = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    S.guestsLoaded = true;
    if (S.guestId && !S.guests.some(g => g.id === S.guestId)) {
      const code = S.code; stopEvent(); S.joinCode = code; S.view = 'join'; setUrl(code);
      toast('Escreva o seu nome para voltar a entrar.'); render(true); return;
    }
    render();
  }, onErr));
  S.unsub.push(ev.collection('wines').onSnapshot(q => {
    S.wines = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.number || 0) - (b.number || 0) || (a.createdAt || 0) - (b.createdAt || 0));
    render();
  }, onErr));
  S.unsub.push(ev.collection('ratings').onSnapshot(q => {
    const r = {}; q.docs.forEach(d => { r[d.id] = (d.data().scores) || {}; });
    S.ratings = r; render();
  }, onErr));
}

async function findOrCreateGuest(code, name) {
  const gc = fs.collection('events').doc(code).collection('guests');
  const snap = await gc.get();
  const same = snap.docs.find(d => (d.data().name || '').trim().toLowerCase() === name.toLowerCase());
  if (same) return same.id; // same name = same person coming back
  const ref = await gc.add({ name, joinedAt: Date.now() });
  return ref.id;
}

function enterEvent(code, guestId, pin) {
  S.code = code; S.guestId = guestId; S.hostPin = pin || null; S.labelDone = false;
  saveSession(); setUrl(code); subscribe(); render(true);
}

/* ---------- actions (buttons) ---------- */
const A = {
  home() { S.view = 'home'; render(true); },
  goCreate() { S.view = 'create'; render(true); },
  goHostLogin() { S.view = 'hostLogin'; render(true); },

  goJoin() {
    const c = val('code').toUpperCase().replace(/[^A-Z]/g, '');
    if (c.length !== 4) return toast('Escreva o código da prova (4 letras).');
    S.joinCode = c; S.view = 'join'; render(true);
  },

  async join() {
    const name = val('name');
    if (!name) return toast('Escreva o seu nome.');
    const code = S.joinCode;
    const ev = await fs.collection('events').doc(code).get();
    if (!ev.exists) { S.view = 'home'; setUrl(null); render(true); return toast('Não existe nenhuma prova com o código ' + code + '.'); }
    const gid = await findOrCreateGuest(code, name);
    const old = loadSession();
    const pin = old && old.code === code ? old.hostPin : null;
    enterEvent(code, gid, pin);
  },

  async create() {
    const name = val('name');
    if (!name) return toast('Escreva o seu nome.');
    let code = null;
    for (let i = 0; i < 10; i++) {
      const c = randCode();
      const s = await fs.collection('events').doc(c).get();
      if (!s.exists) { code = c; break; }
    }
    if (!code) return toast('Não foi possível criar a prova. Tente novamente.');
    const pin = String(Math.floor(1000 + Math.random() * 9000));
    await fs.collection('events').doc(code).set({ createdAt: Date.now(), hostPin: pin, phase: 'setup', current: 0, total: 0, maxScore: 10, perScore: 2 });
    const g = await fs.collection('events').doc(code).collection('guests').add({ name, joinedAt: Date.now() });
    enterEvent(code, g.id, pin);
  },

  async hostLogin() {
    const code = val('code').toUpperCase().replace(/[^A-Z]/g, '');
    const pin = val('pin'), name = val('name');
    if (code.length !== 4 || !pin || !name) return toast('Preencha os três campos.');
    const ev = await fs.collection('events').doc(code).get();
    if (!ev.exists) return toast('Não existe nenhuma prova com o código ' + code + '.');
    if (ev.data().hostPin !== pin) return toast('O PIN do anfitrião não está correto.');
    const gid = await findOrCreateGuest(code, name);
    enterEvent(code, gid, pin);
  },

  async addWine() {
    const name = val('wName');
    if (!name) return toast('Escreva o nome do vinho.');
    const producer = val('wProd');
    const year = val('wYear').replace(/\D/g, '').slice(0, 4);
    let by = S.guestId;
    if (S.isHost) { const sel = document.getElementById('wBy'); if (sel && sel.value) by = sel.value; }
    await evRef().collection('wines').add({ guestId: by, name, producer, year, number: null, createdAt: Date.now() });
    render(true);
    toast(by === S.guestId ? 'Vinho adicionado.' : 'Vinho adicionado em nome de ' + guestName(by) + '.', 'ok');
  },

  async delWine(d) {
    if (!confirm('Remover este vinho?')) return;
    await evRef().collection('wines').doc(d.id).delete();
  },

  async delGuest(d) {
    if (!confirm('Remover ' + guestName(d.id) + ' da prova? Os vinhos desta pessoa também serão removidos.')) return;
    const b = fs.batch();
    b.delete(evRef().collection('guests').doc(d.id));
    b.delete(evRef().collection('ratings').doc(d.id));
    S.wines.filter(w => w.guestId === d.id).forEach(w => b.delete(evRef().collection('wines').doc(w.id)));
    await b.commit();
  },

  async start() {
    const n = S.wines.length;
    if (n < 2) return toast('Adicione pelo menos 2 vinhos antes de começar.');
    const maxScore = clampInt(S.event.maxScore, 1, 100, 10);
    let perScore = clampInt(S.event.perScore, 1, 50, 2);
    perScore = Math.max(perScore, Math.ceil(n / (maxScore + 1)));
    if (!confirm('Começar a prova com ' + n + ' vinhos?\n\nDepois disto já não é possível adicionar vinhos.')) return;
    const order = shuffle(S.wines.slice());
    const b = fs.batch();
    order.forEach((w, i) => b.update(evRef().collection('wines').doc(w.id), { number: i + 1 }));
    b.update(evRef(), { phase: 'tasting', current: 1, total: n, maxScore, perScore, startedAt: Date.now() });
    await b.commit();
  },

  async score(d) {
    const e = S.event;
    const n = S.editing || e.current;
    const s = parseInt(d.s, 10);
    const mine = myScores();
    const usedElsewhere = Object.keys(mine).filter(k => +k !== n && mine[k] === s).length;
    if (usedElsewhere >= e.perScore) return toast('Já usou o ' + s + ' ' + (e.perScore === 1 ? 'uma vez' : e.perScore + ' vezes') + '.');
    S.ratings[S.guestId] = Object.assign({}, mine, { [n]: s });
    render(true);
    await evRef().collection('ratings').doc(S.guestId).set({ scores: { [n]: s } }, { merge: true });
  },

  edit(d) {
    const n = parseInt(d.n, 10);
    S.editing = n === S.event.current ? null : n;
    render(true); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  backToCurrent() { S.editing = null; render(true); },

  async next() {
    const e = S.event;
    if (e.current < e.total) return evRef().update({ current: e.current + 1 });
    let missing = 0;
    S.guests.forEach(g => { const sc = S.ratings[g.id] || {}; for (let k = 1; k <= e.total; k++) if (sc[k] == null) missing++; });
    const q = missing
      ? 'Faltam algumas pontuações (' + missing + '). As que faltam simplesmente não contam.\n\nMostrar os resultados agora?'
      : 'Todos pontuaram todos os vinhos. Mostrar os resultados agora?';
    if (!confirm(q)) return;
    await evRef().update({ phase: 'done', finishedAt: Date.now() });
  },
  async prev() { const e = S.event; if (e.current > 1) await evRef().update({ current: e.current - 1 }); },

  toggleLabels() {
    if (!S.showLabels && !confirm('Esta lista revela qual é o vinho de cada garrafa.\n\nSe também está a provar, estraga a surpresa. Mostrar?')) return;
    S.showLabels = !S.showLabels; render(true);
  },
  labelDone() { S.labelDone = true; saveSession(); render(true); },
  showMyLabel() { S.labelDone = false; saveSession(); render(true); window.scrollTo({ top: 0, behavior: 'smooth' }); },

  async reopen() {
    if (!confirm('Voltar à prova? Todos poderão alterar as pontuações outra vez.')) return;
    await evRef().update({ phase: 'tasting' });
  },

  leave() {
    const msg = S.event && S.event.phase === 'done'
      ? 'Sair desta prova?'
      : 'Sair desta prova?\n\nPode voltar mais tarde lendo o código outra vez e escrevendo o mesmo nome.';
    if (!confirm(msg)) return;
    stopEvent(); setUrl(null); S.view = 'home'; render(true);
  },

  newTasting() {
    if (!confirm('Criar uma prova nova? Estes resultados ficam guardados, mas vai sair deste ecrã.')) return;
    stopEvent(); setUrl(null); S.view = 'create'; render(true);
  }
};

/* ---------- screens ---------- */
function homeView() {
  return `
  <div class="brand"><div class="glass" aria-hidden="true">🍷</div><h1>Prova Cega de Vinhos</h1>
    <p class="lead">Provar, pontuar e descobrir o favorito da noite.</p></div>
  <div class="card">
    <h2>Entrar numa prova</h2>
    <label for="code">Código da prova</label>
    <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ex.: KTRB" data-enter="goJoin">
    <button class="btn primary" data-act="goJoin">Continuar</button>
  </div>
  <div class="card">
    <h2>É o anfitrião esta noite?</h2>
    <button class="btn green" data-act="goCreate">Criar uma prova nova</button>
    <button class="textbtn" data-act="goHostLogin">Sou o anfitrião e perdi o meu ecrã</button>
  </div>`;
}

function joinView() {
  return `
  <div class="brand"><div class="glass" aria-hidden="true">🍷</div><h1>Olá!</h1>
    <p class="lead">Vai entrar na prova <b>${esc(S.joinCode)}</b></p></div>
  <div class="card">
    <label for="name">O seu nome</label>
    <input id="name" autocomplete="given-name" maxlength="40" data-enter="join">
    <p class="small">Se houver outra pessoa com o mesmo nome, acrescente o apelido.</p>
    <button class="btn primary" data-act="join">Entrar na prova</button>
  </div>
  <button class="textbtn" data-act="home">Voltar</button>`;
}

function createView() {
  return `
  <h1>Criar uma prova nova</h1>
  <div class="card">
    <p>Vai ser o anfitrião. Pode na mesma adicionar os seus vinhos e pontuar como todos os outros.</p>
    <label for="name">O seu nome</label>
    <input id="name" autocomplete="given-name" maxlength="40" data-enter="create">
    <button class="btn green" data-act="create">Criar a prova</button>
  </div>
  <button class="textbtn" data-act="home">Voltar</button>`;
}

function hostLoginView() {
  return `
  <h1>Voltar ao ecrã do anfitrião</h1>
  <div class="card">
    <label for="code">Código da prova</label>
    <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off">
    <label for="pin">PIN do anfitrião</label>
    <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off">
    <label for="name">O seu nome</label>
    <input id="name" autocomplete="given-name" maxlength="40" data-enter="hostLogin">
    <button class="btn green" data-act="hostLogin">Abrir ecrã do anfitrião</button>
  </div>
  <button class="textbtn" data-act="home">Voltar</button>`;
}

function topBar() {
  return `<div class="top"><span>Prova <b>${esc(S.code)}</b>${S.isHost ? ', é o anfitrião' : ''}</span>
    <button class="smallbtn" data-act="leave">Sair</button></div>`;
}

function hostSetupPanel(me) {
  const e = S.event, n = S.wines.length;
  const url = location.origin + location.pathname + '?e=' + S.code;
  const winesOf = id => S.wines.filter(w => w.guestId === id).length;
  const needed = Math.ceil(n / (e.maxScore + 1));
  const hint = n === 0 ? '' : (e.maxScore + 1) * e.perScore >= n
    ? `Funciona para ${plural(n, 'vinho', 'vinhos')}.`
    : `Com ${n} vinhos, cada pontuação poderá ser usada ${needed} vezes, para que todos possam pontuar todos os vinhos.`;
  return `
  <div class="card host">
    <span class="host-tag">Anfitrião</span>
    <h2>Como os convidados entram</h2>
    <p>Peça a todos para apontarem a câmara do telemóvel para este quadrado:</p>
    <div id="qr" aria-label="Código QR para entrar"></div>
    <p class="center small">Ou abra <span class="url">${esc(url.replace(/^https?:\/\//, '').replace(/\?.*$/, ''))}</span> e escreva o código:</p>
    <span class="bigcode">${esc(S.code)}</span>
    <p class="small">O seu PIN de anfitrião é <b>${esc(e.hostPin)}</b>. Aponte-o, caso perca este ecrã.</p>
  </div>
  <div class="card host">
    <h2>Quem já chegou (${S.guests.length})</h2>
    ${S.guests.map(g => `<div class="list-row"><div class="who"><b>${esc(g.name)}</b>${g.id === S.guestId ? ' (você)' : ''}
      <span class="sub">${winesOf(g.id) ? plural(winesOf(g.id), 'vinho', 'vinhos') : 'ainda sem vinho'}</span></div>
      ${g.id !== S.guestId ? `<button class="smallbtn" data-act="delGuest" data-id="${esc(g.id)}">Remover</button>` : ''}</div>`).join('')}
  </div>
  <div class="card host">
    <h2>Regras de pontuação</h2>
    <div class="num-line">Pontuações de 0 a <input id="maxScore" type="number" inputmode="numeric" min="1" max="100" value="${e.maxScore}"></div>
    <div class="num-line">Cada pontuação pode ser usada <input id="perScore" type="number" inputmode="numeric" min="1" max="50" value="${e.perScore}"> vezes</div>
    ${hint ? `<p class="small">${hint}</p>` : ''}
    <button class="btn green" data-act="start" ${n < 2 ? 'disabled' : ''}>Começar a prova</button>
    ${n < 2 ? '<p class="small">São precisos pelo menos 2 vinhos para começar.</p>' : '<p class="small">Cada vinho recebe um número ao acaso quando começar.</p>'}
  </div>`;
}

function wineLine(w) {
  const bits = [w.producer, w.year].filter(Boolean).join(', ');
  return bits ? `<span class="sub">${esc(bits)}</span>` : '';
}

function setupView(me) {
  const mine = S.wines.filter(w => w.guestId === S.guestId);
  const others = S.guests.filter(g => g.id !== S.guestId);
  return `${topBar()}
  <h1>Olá, ${esc(me.name)}!</h1>
  ${S.isHost ? hostSetupPanel(me) : ''}
  <div class="card">
    <h2>Os seus vinhos</h2>
    <p class="small">Só você vê esta lista. Todos ficam a saber no fim.</p>
    ${mine.length ? mine.map(w => `<div class="list-row"><div class="who"><b>${esc(w.name)}</b>${wineLine(w)}</div>
      <button class="smallbtn" data-act="delWine" data-id="${esc(w.id)}">Remover</button></div>`).join('')
      : '<p class="empty">Ainda não adicionou nenhum vinho.</p>'}
    <h3>Adicionar um vinho</h3>
    ${S.isHost && others.length ? `<label for="wBy">Trazido por</label><select id="wBy">
      <option value="${esc(S.guestId)}">Eu</option>
      ${others.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select>` : ''}
    <label for="wName">Nome do vinho</label>
    <input id="wName" maxlength="80" placeholder="ex.: Douro Reserva" data-enter="addWine">
    <label for="wProd">Produtor (se souber)</label>
    <input id="wProd" maxlength="80">
    <label for="wYear">Ano (se souber)</label>
    <input id="wYear" inputmode="numeric" maxlength="4" data-enter="addWine">
    <button class="btn primary" data-act="addWine">Adicionar este vinho</button>
  </div>
  ${!S.isHost ? `<div class="waiting">À espera que o anfitrião comece a prova<br>
    <span class="small">${plural(S.wines.length, 'vinho', 'vinhos')} de ${plural(S.guests.length, 'pessoa', 'pessoas')} até agora</span></div>` : ''}`;
}

function myLabelCard() {
  const mine = S.wines.filter(w => w.guestId === S.guestId && w.number);
  if (!mine.length || S.labelDone) return '';
  return `<div class="card">
    <h2>Antes de provar: numere a sua garrafa</h2>
    <p>Ponha ${mine.length > 1 ? 'estes números nas suas garrafas' : 'este número na sua garrafa'} e tape o rótulo para ninguém reconhecer:</p>
    <div class="tag-list">${mine.map(w => `<div class="lbl"><span class="tag-num">${w.number}</span><span>${esc(w.name)}</span></div>`).join('')}</div>
    <p class="small">Não conte a ninguém!</p>
    <button class="btn outline" data-act="labelDone">Feito, a garrafa já está numerada</button>
  </div>`;
}

function hostTastingPanel() {
  const e = S.event, cur = e.current;
  const waiting = S.guests.filter(g => (S.ratings[g.id] || {})[cur] == null);
  const done = S.guests.length - waiting.length;
  const sheet = S.wines.filter(w => w.number).map(w => `<div class="lbl"><span class="tag-num">${w.number}</span>
    <span><b>${esc(w.name)}</b><br><span class="small">trazido por ${esc(guestName(w.guestId))}</span></span></div>`).join('');
  return `<div class="card host">
    <span class="host-tag">Anfitrião</span>
    <h2>${done} de ${S.guests.length} já pontuaram o vinho ${cur}</h2>
    <p class="small">${waiting.length ? 'Ainda falta: ' + waiting.map(g => esc(g.name)).join(', ') : 'Todos já pontuaram este vinho.'}</p>
    <div class="row">
      <button class="btn outline narrow" data-act="prev" ${cur <= 1 ? 'disabled' : ''}>Anterior</button>
      <button class="btn green" data-act="next">${cur < e.total ? 'Seguinte: vinho ' + (cur + 1) : 'Mostrar resultados'}</button>
    </div>
    <button class="textbtn" data-act="toggleLabels">${S.showLabels ? 'Esconder a lista de garrafas' : 'Mostrar a lista de garrafas'}</button>
    ${S.showLabels ? `<p class="spoiler">Atenção: esta lista revela qual é cada vinho.</p><div class="tag-list">${sheet}</div>` : ''}
  </div>`;
}

function tastingView(me) {
  const e = S.event, cur = e.current;
  const n = S.editing || cur;
  const mine = myScores();
  const my = mine[n];
  const usedElsewhere = s => Object.keys(mine).filter(k => +k !== n && mine[k] === s).length;

  let grid = '';
  for (let s = 0; s <= e.maxScore; s++) {
    const left = e.perScore - usedElsewhere(s);
    const sel = my === s, out = left <= 0 && !sel;
    const note = sel ? 'a sua nota' : out ? 'esgotado' : (left === 1 ? 'resta 1' : 'restam ' + left);
    grid += `<button class="score${sel ? ' sel' : ''}" data-act="score" data-s="${s}" ${out ? 'disabled' : ''} aria-pressed="${sel}">
      <span class="n">${s}</span><span class="left">${note}</span></button>`;
  }

  let chips = '';
  for (let k = 1; k <= cur; k++) {
    const v = mine[k];
    chips += `<button class="chip${v == null && k < cur ? ' missing' : ''}${k === n ? ' active' : ''}" data-act="edit" data-n="${k}">
      Vinho ${k}<b>${v == null ? '–' : v}</b></button>`;
  }
  const hasLabel = S.wines.some(w => w.guestId === S.guestId && w.number);

  return `${topBar()}
  ${myLabelCard()}
  ${S.editing ? `<div class="changing"><b>Está a alterar a pontuação do vinho ${n}.</b>
    <button class="btn outline" data-act="backToCurrent">Voltar ao vinho ${cur}</button></div>` : ''}
  <div class="label-wrap"><div class="bottle-label">
    <div class="cap">${S.editing ? 'A alterar' : 'A provar agora'}</div>
    <div class="num">${n}</div><div class="of">vinho ${n} de ${e.total}</div></div></div>
  ${my == null ? '<p class="prompt">Toque na sua pontuação</p>'
    : `<div class="saved">Guardado. Deu ${my} ao vinho ${n}.<br><span style="font-weight:400">Toque noutro número para mudar.</span></div>`}
  <div class="scores">${grid}</div>
  <p class="small center" style="margin-top:10px">Cada pontuação pode ser usada ${e.perScore} vezes no total.</p>
  <div class="card">
    <h2>As suas pontuações</h2>
    <p class="small">Toque num vinho para alterar a pontuação.</p>
    <div class="chips">${chips}</div>
    ${hasLabel && S.labelDone ? '<button class="textbtn" data-act="showMyLabel">Ver outra vez o número da minha garrafa</button>' : ''}
  </div>
  ${S.isHost ? hostTastingPanel() : ''}`;
}

function computeResults() {
  const rows = S.wines.filter(w => w.number).map(w => {
    const vals = Object.values(S.ratings).map(sc => sc[w.number]).filter(v => typeof v === 'number');
    const sum = vals.reduce((a, b) => a + b, 0);
    return Object.assign({}, w, {
      count: vals.length, avg: vals.length ? sum / vals.length : null,
      min: vals.length ? Math.min(...vals) : null, max: vals.length ? Math.max(...vals) : null
    });
  });
  rows.sort((a, b) => (b.avg == null ? -1 : b.avg) - (a.avg == null ? -1 : a.avg) || a.number - b.number);
  rows.forEach(r => { r.rank = r.avg == null ? null : 1 + rows.filter(o => o.avg != null && o.avg > r.avg + 1e-9).length; });
  return rows;
}

function resultsView(me) {
  const rows = computeResults();
  const winners = rows.filter(r => r.rank === 1);
  const medal = r => ({ 1: '🥇', 2: '🥈', 3: '🥉' }[r.rank] || '');
  const sub = w => [w.producer, w.year].filter(Boolean).join(', ');

  const mine = myScores();
  const myVals = Object.values(mine);
  const myTop = myVals.length ? Math.max(...myVals) : null;
  const myFavs = myTop == null ? [] : rows.filter(r => mine[r.number] === myTop);
  const divisive = rows.filter(r => r.count > 1).sort((a, b) => (b.max - b.min) - (a.max - a.min))[0];

  return `${topBar()}
  <h1 class="center">Resultados da noite</h1>
  ${winners.length > 1 ? '<p class="center lead">Empate no primeiro lugar!</p>' : ''}
  ${winners.map(w => `<div class="winner reveal">
    <div class="medal" aria-hidden="true">🏆</div>
    <div class="soft">Vinho ${w.number}</div>
    <div class="wname">${esc(w.name)}</div>
    ${sub(w) ? `<div>${esc(sub(w))}</div>` : ''}
    <div class="soft" style="margin-top:6px">trazido por ${esc(guestName(w.guestId))}</div>
    <div class="avg">${fmt(w.avg)}</div>
    <div class="soft">média de ${plural(w.count, 'pessoa', 'pessoas')}</div>
  </div>`).join('')}
  <div class="card">
    <h2>Classificação completa</h2>
    ${rows.map(r => `<div class="rank">
      <div class="rk${medal(r) ? ' medal' : ''}">${medal(r) || (r.rank || '–')}</div>
      <div class="info"><b>${esc(r.name)}</b>
        ${sub(r) ? `<span class="sub">${esc(sub(r))}</span>` : ''}
        <span class="sub">Vinho ${r.number}, trazido por ${esc(guestName(r.guestId))}</span></div>
      <div class="av">${fmt(r.avg)}</div></div>`).join('')}
  </div>
  ${myFavs.length ? `<div class="card"><h2>O seu favorito</h2>
    <p>Deu a sua nota mais alta (${myTop}) a <b>${myFavs.map(r => esc(r.name)).join('</b> e <b>')}</b>.</p></div>` : ''}
  ${divisive && divisive.max > divisive.min ? `<div class="card"><h2>Opiniões mais divididas</h2>
    <p><b>${esc(divisive.name)}</b> teve notas desde ${divisive.min} até ${divisive.max}.</p></div>` : ''}
  ${S.isHost ? `<div class="card host"><span class="host-tag">Anfitrião</span>
    <button class="btn outline" data-act="reopen">Voltar à prova</button>
    <button class="btn green" data-act="newTasting">Criar uma prova nova</button></div>` : ''}`;
}

function configView() {
  return `<h1>Quase pronto</h1><div class="card">
    <p>A aplicação ainda não está ligada à base de dados.</p>
    <p>Abra o <b>index.html</b>, procure a parte que diz <b>PASTE_YOUR_API_KEY</b> e cole lá as definições do Firebase. O ficheiro README explica como.</p></div>`;
}

function view() {
  if (!fs) return configView();
  if (!S.code) {
    if (S.view === 'join') return joinView();
    if (S.view === 'create') return createView();
    if (S.view === 'hostLogin') return hostLoginView();
    return homeView();
  }
  if (!S.event || !S.guestsLoaded) return '<p class="center lead" style="margin-top:40vh">A carregar a prova…</p>';
  const me = S.guests.find(g => g.id === S.guestId);
  if (!me) return '<p class="center lead" style="margin-top:40vh">A carregar…</p>';
  if (S.event.phase === 'tasting') return tastingView(me);
  if (S.event.phase === 'done') return resultsView(me);
  return setupView(me);
}

/* ---------- rendering ---------- */
function render(force) {
  const ae = document.activeElement;
  // Don't wipe what someone is typing; redraw once they leave the box.
  if (!force && ae && $app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) {
    if (!S.pending) {
      S.pending = true;
      ae.addEventListener('blur', () => setTimeout(() => { if (S.pending) { S.pending = false; render(); } }, 350), { once: true });
    }
    return;
  }
  S.pending = false;
  if (force && ae && ae.blur && $app.contains(ae)) ae.blur();
  $app.innerHTML = view();
  const qr = document.getElementById('qr');
  if (qr && window.QRCode) {
    new QRCode(qr, { text: location.origin + location.pathname + '?e=' + S.code, width: 230, height: 230, correctLevel: QRCode.CorrectLevel.M });
  }
}

let busy = false;
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || busy) return;
  const fn = A[b.dataset.act];
  if (!fn) return;
  busy = true;
  Promise.resolve().then(() => fn(b.dataset)).catch(err => {
    console.error(err);
    toast('Não funcionou. Verifique a ligação à internet e tente novamente.');
  }).finally(() => { busy = false; });
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset || !e.target.dataset.enter) return;
  e.preventDefault();
  const btn = $app.querySelector('[data-act="' + e.target.dataset.enter + '"]');
  if (btn) btn.click();
});
$app.addEventListener('change', e => {
  if (e.target.id !== 'maxScore' && e.target.id !== 'perScore') return;
  const maxScore = clampInt(val('maxScore'), 1, 100, 10), perScore = clampInt(val('perScore'), 1, 50, 2);
  evRef().update({ maxScore, perScore }).catch(() => toast('Não foi possível guardar as regras. Verifique a internet.'));
});

/* ---------- start ---------- */
(function init() {
  if (!window.firebase || !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('PASTE') === 0) { render(true); return; }
  firebase.initializeApp(firebaseConfig);
  fs = firebase.firestore();
  const urlCode = (new URLSearchParams(location.search).get('e') || '').toUpperCase().replace(/[^A-Z]/g, '');
  const saved = loadSession();
  if (saved && saved.code && saved.guestId && (!urlCode || urlCode === saved.code)) {
    S.code = saved.code; S.guestId = saved.guestId; S.hostPin = saved.hostPin || null; S.labelDone = !!saved.labelDone;
    setUrl(S.code); subscribe(); render(true);
  } else if (urlCode.length === 4) {
    S.joinCode = urlCode; S.view = 'join'; render(true);
  } else {
    render(true);
  }
})();
</script>
</body>
